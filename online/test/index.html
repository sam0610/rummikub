/* 網頁版連線層:用 Firebase Realtime Database 實作 room 介面。
   房主仍是權威:玩家的 hello/act 只寫進房主的信箱,房主驗證後廣播 state、私下送 hand。
   資料結構 rooms/<code>/{meta, peers/<peer>, inbox/<peer>/<id>, bc/<id>} */
(function () {
  'use strict';
  const PRIVATE = { hello: 1, act: 1 };
  const clone = (x) => (x == null ? x : JSON.parse(JSON.stringify(x)));
  const err = (code, message) => ({ code, message });
  let fb = null, authP = null;

  function init() {
    if (fb) return fb;
    const F = window.firebase, cfg = window.MK_FIREBASE_CONFIG;
    if (!F || !cfg || !cfg.databaseURL) throw err('config', '尚未設定 Firebase,請先填入 firebase-config.json');
    const app = F.apps && F.apps.length ? F.app() : F.initializeApp(cfg);
    fb = { F, db: F.database(app), auth: F.auth(app) };
    return fb;
  }
  function signIn() {
    if (authP) return authP;
    const { auth } = init();
    authP = new Promise((resolve, reject) => {
      const t = setTimeout(() => { authP = null; reject(err('timeout', '連不上連線伺服器,請稍後再試')); }, 12000);
      const go = () => auth.signInAnonymously().then((c) => { clearTimeout(t); resolve(c.user.uid); }, (e) => { clearTimeout(t); authP = null; reject(err('auth', '登入失敗:' + (e && e.code ? e.code : '未知錯誤'))); });
      go();
    });
    return authP;
  }
  const dec = (x) => { try { return x == null ? null : JSON.parse(x); } catch (e) { return null; } };
  const withTimeout = (p, ms, e) => new Promise((res, rej) => { const t = setTimeout(() => rej(e), ms); p.then((v) => { clearTimeout(t); res(v); }, (x) => { clearTimeout(t); rej(err('server', '連線伺服器拒絕了請求(' + (x && x.code ? x.code : '') + ')')); }); });

  async function join(name, opts) {
    const code = String(name || '').replace(/^mk-/, '').toLowerCase();
    const isHost = !!(opts && opts.host);
    const { db } = init();
    const uid = await signIn();
    const room = db.ref('rooms/' + code);
    const me = isHost ? uid + '-h' : uid + '-' + Math.random().toString(36).slice(2, 7);
    const handlers = {}, peerLs = new Set(), connLs = new Set();
    let myPres = {}, list = [], connected = false, closed = false, hostPeer = null;
    const offs = [];

    const stamp = (e) => ({ peer: e.peer, presence: clone(e.presence) || {}, updatedAt: e.updatedAt || 0, by: null, isMe: e.peer === me, sameTab: e.peer === me, kind: 'viewer', guest: false });
    const peers = () => list.map(stamp);
    const fire = (set, arg) => set.forEach((f) => { try { f(arg); } catch (e) { console.error(e); } });
    function setList(next) {
      const old = new Map(list.map((p) => [p.peer, p]));
      const nw = new Map(next.map((p) => [p.peer, p]));
      const joined = [], left = [], updated = [];
      for (const [k, v] of nw) { if (!old.has(k)) joined.push(v); else if (JSON.stringify(old.get(k).presence) !== JSON.stringify(v.presence)) updated.push(v); }
      for (const [k, v] of old) if (!nw.has(k)) left.push(v);
      list = next;
      if (joined.length || left.length || updated.length) fire(peerLs, { peers: peers(), joined: joined.map(stamp), left: left.map(stamp), updated: updated.map(stamp) });
    }
    function deliver(topic, data, from) {
      const set = handlers[topic];
      if (!set) return;
      const base = { topic, data: clone(data), peer: from, by: null, isMe: from === me, sameTab: from === me, kind: 'viewer', guest: false };
      set.forEach((f) => { try { f(base); } catch (e) { console.error(e); } });
    }

    /* ----- 房間建立 / 驗證 ----- */
    const metaRef = room.child('meta');
    const meta = (await withTimeout(metaRef.once('value'), 12000, err('timeout', '連不上連線伺服器,請稍後再試'))).val();
    if (isHost) {
      if (meta && meta.uid !== uid) throw err('taken', '房間代碼已被使用');
      await withTimeout(metaRef.set({ uid, host: me, ts: Date.now() }), 12000, err('timeout', '連不上連線伺服器,請稍後再試'));
      hostPeer = me;
      // 清掉上次殘留的訊息
      room.child('bc').remove().catch(() => {});
      room.child('inbox/' + me).remove().catch(() => {});
    } else {
      if (!meta || !meta.host) throw err('closed', '找不到這個房間,請確認代碼,並確認房主正開著此頁');
      hostPeer = meta.host;
    }

    /* ----- 發送 ----- */
    const push = (path, obj) => { try { return room.child(path).push(obj).catch(() => {}); } catch (e) {} };
    function toInbox(peer, topic, data) { push('inbox/' + peer, { topic, d: JSON.stringify(data === undefined ? null : data), from: me }); }
    function toAll(topic, data, from) {
      const ref = room.child('bc').push();
      ref.set({ topic, d: JSON.stringify(data === undefined ? null : data), from: from || me }).catch(() => {});
      setTimeout(() => { try { ref.remove(); } catch (e) {} }, 20000);
    }
    function hostRelay(topic, data, from) {
      const to = data && typeof data === 'object' ? data.toPeer : null;
      if (to) { if (to !== me) toInbox(to, topic, data); return; }
      if (PRIVATE[topic] && from !== me) return;
      toAll(topic, data, from); // 各端用 from 過濾自己
    }

    /* ----- 接收 ----- */
    const inboxRef = room.child('inbox/' + me);
    const onInbox = inboxRef.on('child_added', (snap) => {
      const m = snap.val(); try { snap.ref.remove(); } catch (e) {}
      if (!m || closed) return;
      const dd = dec(m.d); deliver(m.topic, dd, m.from);
      if (isHost && m.from !== me) hostRelay(m.topic, dd, m.from);
    });
    offs.push(() => inboxRef.off('child_added', onInbox));
    if (!isHost) {
      const bcRef = room.child('bc');
      let lastKey = null;
      try { const s = await withTimeout(bcRef.orderByKey().limitToLast(1).once('value'), 8000, err('timeout', '連線逾時')); s.forEach((c) => { lastKey = c.key; }); } catch (e) {}
      const q = lastKey ? bcRef.orderByKey().startAfter(lastKey) : bcRef;
      const onBc = q.on('child_added', (snap) => {
        const m = snap.val();
        if (!m || closed || m.from === me) return;
        deliver(m.topic, dec(m.d), m.from);
      });
      offs.push(() => q.off('child_added', onBc));
    }

    /* ----- 在線名單 ----- */
    const myRef = room.child('peers/' + me);
    const writeMe = () => { myRef.onDisconnect().remove(); return myRef.set({ p: JSON.stringify(myPres), at: Date.now() }).catch(() => {}); };
    const peersRef = room.child('peers');
    const onPeersVal = peersRef.on('value', (snap) => {
      const v = snap.val() || {};
      const next = Object.keys(v).sort().map((k) => ({ peer: k, presence: (v[k] && dec(v[k].p)) || {}, updatedAt: (v[k] && v[k].at) || 0 }));
      setList(next);
    }, (e) => console.error('peers listen', e));
    offs.push(() => peersRef.off('value', onPeersVal));
    const connRef = db.ref('.info/connected');
    let first = true;
    const onConn = connRef.on('value', (snap) => {
      const on = !!snap.val();
      if (on) writeMe();
      if (on === connected && !first) return;
      first = false;
      connected = on;
      fire(connLs, on);
    });
    offs.push(() => connRef.off('value', onConn));
    connected = true; // 已成功讀寫過 meta
    await writeMe();

    return {
      async emit(topic, data) {
        if (closed) return;
        const d = clone(data);
        deliver(topic, d, me);
        if (isHost) hostRelay(topic, d, me);
        else toInbox(hostPeer, topic, d);
      },
      on(topic, fn) { (handlers[topic] = handlers[topic] || new Set()).add(fn); return () => handlers[topic] && handlers[topic].delete(fn); },
      async presence(patch) {
        myPres = Object.assign({}, myPres, patch || {});
        for (const k of Object.keys(myPres)) if (myPres[k] === null) delete myPres[k];
        setList(list.map((p) => (p.peer === me ? { peer: me, presence: myPres, updatedAt: Date.now() } : p)));
        await myRef.set({ p: JSON.stringify(myPres), at: Date.now() }).catch(() => {});
      },
      peers,
      onPeers(fn) { peerLs.add(fn); return () => peerLs.delete(fn); },
      onConnection(fn) { connLs.add(fn); return () => connLs.delete(fn); },
      connected: () => connected,
      async leave() {
        closed = true;

        for (const k of Object.keys(handlers)) handlers[k].clear();
      },
    };
  }

  window.MkNet = { ns: { join } };
})();

/* ====== 魔橋 核心邏輯(純函式,無 DOM) ====== */
const COLOR_NAMES = ['紅', '藍', '黑', '橙'];
const TILES = [];
for (let id = 0; id < 106; id++) {
  if (id >= 104) TILES.push({ id, j: true, c: -1, n: 0 });
  else {
    const k = id % 52;
    TILES.push({ id, j: false, c: Math.floor(k / 13), n: (k % 13) + 1 });
  }
}
const FAKE = [];
for (let k = 0; k < 52; k++) FAKE.push({ id: 200 + k, j: false, c: Math.floor(k / 13), n: (k % 13) + 1 });
const tileName = (id) => (T(id).j ? 'Joker' : COLOR_NAMES[T(id).c] + T(id).n);
const T = (id) => (id >= 200 ? FAKE[id - 200] : TILES[id]);
const JOKER_VALUE = 30;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 分析一組牌:回傳 {kind, score, order, jv} 或 null(無效)
   order = 建議排列順序,jv = Joker 代表的數字 */
function analyzeSet(ids) {
  const n = ids.length;
  if (n < 3 || n > 13) return null;
  const reals = [], jokers = [];
  for (const id of ids) {
    const t = T(id);
    if (!t) return null;
    (t.j ? jokers : reals).push(t);
  }
  if (reals.length === 0) return null;
  let best = null;
  // 組合(同數字、不同顏色,3~4 張)
  if (n <= 4 && reals.every((t) => t.n === reals[0].n)) {
    const cols = new Set(reals.map((t) => t.c));
    if (cols.size === reals.length) {
      const order = [...reals].sort((a, b) => a.c - b.c).map((t) => t.id).concat(jokers.map((t) => t.id));
      const jv = {};
      jokers.forEach((t) => (jv[t.id] = reals[0].n));
      best = { kind: 'group', score: reals[0].n * n, order, jv };
    }
  }
  // 順子(同顏色、連續數字)
  if (reals.every((t) => t.c === reals[0].c)) {
    const nums = reals.map((t) => t.n).sort((a, b) => a - b);
    let ok = true;
    for (let i = 1; i < nums.length; i++) if (nums[i] === nums[i - 1]) { ok = false; break; }
    if (ok) {
      const min = nums[0], max = nums[nums.length - 1];
      if (max - min + 1 <= n) {
        const start = Math.min(min, 14 - n);
        let score = 0;
        const byNum = {};
        reals.forEach((t) => (byNum[t.n] = t.id));
        const order = [], jv = {};
        let ji = 0;
        for (let k = 0; k < n; k++) {
          const v = start + k;
          score += v;
          if (byNum[v] !== undefined) order.push(byNum[v]);
          else { const jt = jokers[ji++]; order.push(jt.id); jv[jt.id] = v; }
        }
        if (!best || score > best.score) best = { kind: 'run', score, order, jv, start };
      }
    }
  }
  return best;
}

/* 顯示用排列:有效牌組自動排好,未完成的牌組按顏色/數字排 */
function layoutSet(ids) {
  const a = analyzeSet(ids);
  if (a) return { ids: a.order, jv: a.jv, valid: true, kind: a.kind, score: a.score };
  const s = [...ids].sort((x, y) => {
    const a = T(x), b = T(y);
    if (a.j !== b.j) return a.j ? 1 : -1;
    return a.c - b.c || a.n - b.n || x - y;
  });
  return { ids: s, jv: {}, valid: false };
}

const setKey = (s) => [...s].sort((a, b) => a - b).join(',');

/* 全新牌組(完全由本回合打出的牌構成)的總點數 */
function newSetPoints(prev, next) {
  const prevIds = new Set(prev.flat());
  const prevKeys = new Set(prev.map(setKey));
  let pts = 0;
  for (const s of next) {
    if (prevKeys.has(setKey(s))) continue;
    if (s.some((id) => prevIds.has(id))) continue;
    const a = analyzeSet(s);
    if (a) pts += a.score;
  }
  return pts;
}

  const prevIds = new Set(prev.flat());
  const nextFlat = next.flat();
  const nextIds = new Set(nextFlat);
  if (nextFlat.length !== nextIds.size) return { ok: false, err: '有重複的牌' };
  for (const id of nextFlat) if (!Number.isInteger(id) || id < 0 || id > 105) return { ok: false, err: '無效的牌' };
  for (const id of prevIds) if (!nextIds.has(id)) return { ok: false, err: '桌面上的牌不可以拿走' };
  const handSet = new Set(hand);
  const added = nextFlat.filter((id) => !prevIds.has(id));
  for (const id of added) if (!handSet.has(id)) return { ok: false, err: '用了不在你手上的牌' };
  if (added.length === 0) return { ok: false, err: '還沒有打出任何手牌' };
  for (const s of next) {
    if (s.length < 3) return { ok: false, err: '每組至少要 3 張牌', bad: s };
    if (!analyzeSet(s)) return { ok: false, err: '桌面上有不合規則的牌組', bad: s };
  }
  if (!melded) {
    const prevKeys = new Set(prev.map(setKey));
    let pts = 0;
    for (const s of next) {
      if (prevKeys.has(setKey(s))) continue;
      if (s.some((id) => prevIds.has(id))) return { ok: false, err: '首次出牌不能動用桌面上的牌' };
      pts += analyzeSet(s).score;
    }
    if (pts < minInitial) return { ok: false, err: `首次出牌需要 ${minInitial} 點以上(目前 ${pts} 點)`, pts };
    return { ok: true, added, pts };
  }
  return { ok: true, added };
}

const tileValue = (id) => (T(id).j ? JOKER_VALUE : T(id).n);
const handValue = (hand) => hand.reduce((s, id) => s + tileValue(id), 0);

/* ====== 對局流程(房主執行) ====== */
function makeGame(players, settings) {
  const pool = shuffle([...Array(106).keys()]);
  const G = {
    rev: 0,
    phase: 'play',
    settings: { timer: 0, initial: 30, ...(settings || {}) },
    players: players.map((p) => ({
      id: p.id, name: p.name, bot: !!p.bot, level: p.level || null, tok: p.tok || null, peer: p.peer || null,
      connected: p.bot ? true : p.connected !== false,
      hand: pool.splice(0, 14), melded: false, score: p.score || 0,
    })),
    board: [], pool, turn: 0, turnNo: 1, stall: 0,
    winner: null, endReason: null, results: null, lastPlaced: [],
    log: [], logSeq: 0, seq: players.length + 1,
  };
  G.turn = Math.floor(Math.random() * G.players.length);
  return G;
}

function glog(G, m, extra) {
  G.log.push(Object.assign({ k: ++G.logSeq, m }, extra || {}));
  if (G.log.length > 40) G.log.splice(0, G.log.length - 40);
}

function endGame(G, winnerSeat, reason) {
  if (winnerSeat === null || winnerSeat === undefined) {
    let bi = 0;
    G.players.forEach((p, i) => {
      const a = handValue(p.hand), b = handValue(G.players[bi].hand);
      if (a < b || (a === b && p.hand.length < G.players[bi].hand.length)) bi = i;
    });
    winnerSeat = bi;
  }
  const vals = G.players.map((p) => handValue(p.hand));
  const total = vals.reduce((s, v, i) => (i === winnerSeat ? s : s + v), 0);
  G.results = G.players.map((p, i) => {
    const delta = i === winnerSeat ? total : -vals[i];
    p.score += delta;
    return { id: p.id, name: p.name, hand: p.hand.slice(), value: vals[i], delta, total: p.score };
  });
  (G.rounds = G.rounds || []).push({ n: G.rounds.length + 1, win: G.players[winnerSeat].id, d: Object.fromEntries(G.results.map((r) => [r.id, r.delta])) });
  if (G.rounds.length > 60) G.rounds.shift();
  G.phase = 'end';
  G.winner = winnerSeat;
  G.endReason = reason;
  G.rev++;
  glog(G, reason === 'out' ? `${G.players[winnerSeat].name} 打完所有牌,獲勝!` : `牌堆已空且無人能出牌,${G.players[winnerSeat].name} 以最低點數獲勝`);
}

function advance(G) {
  G.turn = (G.turn + 1) % G.players.length;
  G.turnNo++;
}

function playMove(G, seat, nextBoard) {
  const p = G.players[seat];
  if (!Array.isArray(nextBoard)) return { ok: false, err: '資料錯誤' };
  const r = checkMove(G.board, nextBoard, p.hand, p.melded, G.settings.initial);
  if (!r.ok) return r;
  const added = new Set(r.added);
  p.hand = p.hand.filter((id) => !added.has(id));
  G.board = nextBoard.map((s) => layoutSet(s).ids);
  p.melded = true;
  G.lastPlaced = r.added.slice();
  G.stall = 0;
  G.rev++;
  const addedSet = new Set(r.added);
  glog(G, `${p.name} 打出 ${r.added.length} 張牌`, { a: r.added.slice(), t: G.board.filter((st) => st.some((x) => addedSet.has(x))).map((st) => st.slice()) });
  if (p.hand.length === 0) endGame(G, seat, 'out');
  else advance(G);
  return { ok: true, added: r.added };
}

function drawTile(G, seat, why) {
  const p = G.players[seat];
  G.lastPlaced = [];
  G.rev++;
  if (G.pool.length > 0) {
    p.hand.push(G.pool.pop());
    G.stall = 0;
    glog(G, `${p.name} ${why || '抽了一張牌'}`);
    advance(G);
  } else {
    G.stall++;
    glog(G, `${p.name} 無牌可抽,跳過`);
    if (G.stall >= G.players.length) { endGame(G, null, 'blocked'); return; }
    advance(G);
  }
}

/* ====== 電腦玩家 ====== */
let TEMPLATES = null;
function templates() {
  if (TEMPLATES) return TEMPLATES;
  const arr = [];
  for (let c = 0; c < 4; c++)
    for (let L = 3; L <= 5; L++)
      for (let s = 1; s + L - 1 <= 13; s++) {
        const cells = [];
        for (let k = 0; k < L; k++) cells.push([c, s + k]);
        arr.push({ cells, pts: ((2 * s + L - 1) * L) / 2 });
      }
  for (let n = 1; n <= 13; n++)
    for (let mask = 0; mask < 16; mask++) {
      const cols = [0, 1, 2, 3].filter((c) => (mask >> c) & 1);
      if (cols.length < 3) continue;
      arr.push({ cells: cols.map((c) => [c, n]), pts: n * cols.length });
    }
  TEMPLATES = arr;
  return arr;
}

/* 在 handIds 裡找出互不重疊的牌組,使打出的牌最多(byPoints 時改為點數最高) */
function findBestMelds(handIds, byPoints, allowJokers) {
  const stacks = Array.from({ length: 4 }, () => Array.from({ length: 14 }, () => []));
  const jokers = [];
  for (const id of handIds) {
    const t = T(id);
    if (t.j) jokers.push(id); else stacks[t.c][t.n].push(id);
  }
  const rem = stacks.map((r) => r.map((a) => a.length));
  const J0 = allowJokers ? jokers.length : 0;
  const cands = [];
  for (const t of templates()) {
    let miss = 0;
    for (const [c, n] of t.cells) if (rem[c][n] < 1) miss++;
    if (miss <= J0 && miss < t.cells.length) cands.push(t);
  }
  let bestVal = 0, bestPicks = [];
  const picks = [];
  let nodes = 0;
  function dfs(start, val, jleft) {
    if (val > bestVal) { bestVal = val; bestPicks = picks.slice(); }
    if (nodes++ > 30000) return;
    for (let i = start; i < cands.length; i++) {
      const t = cands[i];
      let miss = 0;
      for (const [c, n] of t.cells) if (rem[c][n] < 1) miss++;
      if (miss > jleft) continue;
      const taken = [];
      for (const [c, n] of t.cells) if (rem[c][n] > 0) { rem[c][n]--; taken.push(c * 14 + n); }
      picks.push([i, miss]);
      const v = byPoints ? t.pts : (t.cells.length - miss) * 1000 + t.pts - miss * 5;
      dfs(i, val + v, jleft - miss);
      picks.pop();
      for (const k of taken) rem[(k / 14) | 0][k % 14]++;
    }
  }
  dfs(0, 0, J0);
  const st = stacks.map((r) => r.map((a) => a.slice()));
  const jk = jokers.slice();
  const sets = [], used = new Set();
  let points = 0;
  for (const [i] of bestPicks) {
    const t = cands[i];
    const set = [];
    for (const [c, n] of t.cells) {
      const id = st[c][n].length ? st[c][n].pop() : jk.pop();
      set.push(id);
      used.add(id);
    }
    sets.push(set);
    points += t.pts;
  }
  return { sets, used, points };
}

const JOKER_HAND_LIMIT = 8;

/* 從桌面牌組拿走一批牌後,剩下的是否全部合規;回傳剩下的各段(連號可能被拆成兩段),不合規回傳 null */
function removeFromSet(s, rm) {
  const a = analyzeSet(s);
  if (!a) return null;
  if (a.kind === 'group') {
    const rest = s.filter((x) => !rm.has(x));
    if (!rest.length) return [];
    return analyzeSet(rest) ? [rest] : null;
  }
  const segs = [];
  let cur = [];
  for (const id of a.order) {
    if (rm.has(id)) { if (cur.length) segs.push(cur); cur = []; } else cur.push(id);
  }
  if (cur.length) segs.push(cur);
  return segs.every((x) => analyzeSet(x)) ? segs : null;
}

/* 手牌配合「可以從桌面借出的牌」組新牌組,盡量多打出手牌。回傳 {sets, borrowed, usedHand, boardAfter} 或 null */
function findMeldsBorrow(hand, board) {
  const cands = [];
  board.forEach((s, si) => {
    const a = analyzeSet(s);
    if (!a) return;
    for (const t of s) if (!T(t).j && removeFromSet(s, new Set([t]))) cands.push({ id: t, si });
  });
  if (!cands.length) return null;
  const hst = Array.from({ length: 4 }, () => Array.from({ length: 14 }, () => []));
  const bst = Array.from({ length: 4 }, () => Array.from({ length: 14 }, () => []));
  for (const id of hand) if (!T(id).j) hst[T(id).c][T(id).n].push(id);
  for (const c of cands) bst[T(c.id).c][T(c.id).n].push(c.id);
  const hrem = hst.map((r) => r.map((a) => a.length)), brem = bst.map((r) => r.map((a) => a.length));
  const siOf = new Map(cands.map((c) => [c.id, c.si]));
  const tpl = templates().filter((t) => t.cells.every(([c, n]) => hrem[c][n] + brem[c][n] > 0) && t.cells.some(([c, n]) => hrem[c][n] > 0));
  const build = (picks) => {
    const hs = hst.map((r) => r.map((a) => a.slice())), bs = bst.map((r) => r.map((a) => a.slice()));
    const sets = [], borrowed = new Set(), usedHand = [];
    for (const i of picks) {
      const set = [];
      for (const [c, n] of tpl[i].cells) {
        if (hs[c][n].length) { const id = hs[c][n].shift(); set.push(id); usedHand.push(id); } else { const id = bs[c][n].shift(); set.push(id); borrowed.add(id); }
      }
      sets.push(set);
    }
    return { sets, borrowed, usedHand };
  };
  const check = (picks) => {
    const r = build(picks);
    if (!r.borrowed.size || !r.usedHand.length) return null;
    const bySet = new Map();
    for (const id of r.borrowed) { const si = siOf.get(id); if (!bySet.has(si)) bySet.set(si, new Set()); bySet.get(si).add(id); }
    const after = [];
    for (let si = 0; si < board.length; si++) {
      if (!bySet.has(si)) { after.push(board[si]); continue; }
      const segs = removeFromSet(board[si], bySet.get(si));
      if (!segs) return null;
      after.push(...segs);
    }
    return { sets: r.sets, usedHand: r.usedHand, boardAfter: after };
  };
  let bestVal = -1, bestPicks = null, nodes = 0;
  const picks = [];
  function dfs(start, val) {
    if (val > bestVal && picks.length && check(picks)) { bestVal = val; bestPicks = picks.slice(); }
    if (nodes++ > 20000) return;
    for (let i = start; i < tpl.length; i++) {
      const cells = tpl[i].cells;
      if (!cells.every(([c, n]) => hrem[c][n] + brem[c][n] > 0)) continue;
      let hu = 0, bu = 0;
      const took = [];
      for (const [c, n] of cells) { if (hrem[c][n] > 0) { hrem[c][n]--; hu++; took.push([c, n, 0]); } else { brem[c][n]--; bu++; took.push([c, n, 1]); } }
      picks.push(i);
      dfs(i, val + hu * 1000 - bu * 2 + tpl[i].pts * 0.01);
      picks.pop();
      for (const [c, n, k] of took) { if (k) brem[c][n]++; else hrem[c][n]++; }
    }
  }
  dfs(0, 0);
  return bestPicks ? check(bestPicks) : null;
}

/* 電腦出牌計畫:回傳 {board, placed} 或 null(抽牌) */
function botPlan(hand, board, melded, minInitial) {
  const b = board.map((s) => s.slice());
  let h = hand.slice();
  const placed = [];
  const take = (ids) => {
    const set = new Set(ids);
    h = h.filter((x) => !set.has(x));
    placed.push(...ids);
  };
  if (!melded) {
    let m = findBestMelds(h, true, false);
    if (m.points < minInitial) m = findBestMelds(h, true, true);
    if (m.points < minInitial) return null;
    for (const s of m.sets) b.push(s);
    take(m.sets.flat());
    return { board: b, placed };
  }
  const borrowOnce = () => {
    for (const s of b) {
      if (s.length < 4) continue;
      for (let q = 0; q < s.length; q++) {
        const t = s[q];
        if (T(t).j) continue;
        const rest = s.filter((_, i) => i !== q);
        if (!analyzeSet(rest)) continue;
        const m = findBestMelds(h.concat(t), false, false);
        if (m.used.has(t)) {
          s.splice(q, 1);
          b.push(...m.sets);
          take([...m.used].filter((x) => x !== t));
          return true;
        }
      }
    }
    return false;
  };
  // 把長順子從中間拆成兩組,取出一張牌來組新牌組
  const splitOnce = () => {
    for (let si = 0; si < b.length; si++) {
      const s = b[si];
      if (s.length < 7) continue;
      const a = analyzeSet(s);
      if (!a || a.kind !== 'run') continue;
      for (let q = 3; q <= s.length - 4; q++) {
        const t = a.order[q];
        if (T(t).j) continue;
        const left = a.order.slice(0, q), right = a.order.slice(q + 1);
        if (!analyzeSet(left) || !analyzeSet(right)) continue;
        const m = findBestMelds(h.concat(t), false, false);
        if (m.used.has(t)) {
          b.splice(si, 1, left, right);
          b.push(...m.sets);
          take([...m.used].filter((x) => x !== t));
          return true;
        }
      }
    }
    return false;
  };
  // 換走桌面上的 Joker(替身可以是手牌,也可以是桌面別組多出來的牌),換出來的 Joker 再配合手牌/借牌組新牌組,避免動用手上的 Joker
  const freeJokerOnce = () => {
    const hj = h.filter((x) => T(x).j);
    const hn = h.filter((x) => !T(x).j);
    for (let si = 0; si < b.length; si++) {
      const s = b[si];
      const a = analyzeSet(s);
      if (!a) continue;
      for (const jid of s.filter((x) => T(x).j)) {
        const v = a.jv[jid];
        const reals = s.filter((x) => !T(x).j);
        const col = T(reals[0]).c;
        const cols = new Set(reals.map((x) => T(x).c));
        const fits = (t) => (a.kind === 'run' ? T(t).c === col && T(t).n === v : T(t).n === v && !cols.has(T(t).c));
        const srcs = [];
        for (const x of hn) if (fits(x)) { srcs.push({ rep: x, from: -1 }); break; }
        for (let sj = 0; sj < b.length; sj++) {
          if (sj === si) continue;
          for (const t of b[sj]) {
            if (T(t).j || !fits(t)) continue;
            if (removeFromSet(b[sj], new Set([t]))) srcs.push({ rep: t, from: sj });
          }
        }
        for (const src of srcs) {
          const s1 = s.map((x) => (x === jid ? src.rep : x));
          if (!analyzeSet(s1)) continue;
          const nb = [];
          let ok = true;
          b.forEach((x, i) => {
            if (i === si) nb.push(s1);
            else if (i === src.from) { const segs = removeFromSet(x, new Set([src.rep])); if (!segs) ok = false; else nb.push(...segs); }
            else nb.push(x);
          });
          if (!ok) continue;
          const nh = src.from < 0 ? hn.filter((x) => x !== src.rep) : hn;
          const apply = (newSets, nbAfter, usedHand) => {
            b.length = 0;
            b.push(...nbAfter, ...newSets);
            if (src.from < 0) { placed.push(src.rep); h = h.filter((x) => x !== src.rep); }
            take(usedHand);
          };
          // A: 換出來的 Joker + 手牌
          const m = findBestMelds(nh.concat(jid), false, true);
          if (m.used.has(jid)) { apply(m.sets, nb, [...m.used].filter((x) => x !== jid)); return true; }
          // B: 換出來的 Joker 當替身 + 手牌 + 向桌面借牌
          for (let k = 0; k < 52; k++) {
            const fk = 200 + k;
            const r = findMeldsBorrow(nh.concat(fk), nb);
            if (!r || !r.usedHand.includes(fk)) continue;
            const fix = (x) => (x === fk ? jid : x);
            apply(r.sets.map((st) => st.map(fix)), r.boardAfter, r.usedHand.filter((x) => x !== fk));
            return true;
          }
        }
      }
    }
    return false;
  };
  // 同時從幾個牌組借牌,配合手牌組成新牌組(例如藍2 + 從別組借藍3、藍4)
  const borrowMultiOnce = () => {
    const r = findMeldsBorrow(h, b);
    if (!r) return false;
    b.length = 0;
    b.push(...r.boardAfter, ...r.sets);
    take(r.usedHand);
    return true;
  };
  const extendOnce = (onlyJokers) => {
    let changed = false;
    for (let k = 0; k < h.length; ) {
      const id = h[k];
      if (T(id).j !== !!onlyJokers) { k++; continue; }
      const s = b.find((x) => analyzeSet(x.concat(id)));
      if (s) { s.push(id); placed.push(id); h.splice(k, 1); changed = true; } else k++;
    }
    return changed;
  };
  for (let iter = 0; iter < 12; iter++) {
    let changed = false;
    const m = findBestMelds(h, false, false);
    if (m.sets.length) { b.push(...m.sets); take(m.sets.flat()); changed = true; }
    if (extendOnce(false)) changed = true;
    if (!changed) changed = borrowOnce();
    if (!changed) changed = splitOnce();
    if (!changed) changed = borrowMultiOnce();
    if (!changed) changed = freeJokerOnce();
    if (!changed) break;
  }
  if (h.length > 0 && h.length <= JOKER_HAND_LIMIT) {
    const m2 = findBestMelds(h, false, true);
    if (m2.sets.length) { b.push(...m2.sets); take(m2.sets.flat()); extendOnce(false); }
  }
  if (h.length > 0 && h.every((id) => T(id).j)) extendOnce(true);
  if (!placed.length) return null;
  return { board: b, placed };
}


/* ===== 全桌重組:把桌面所有牌加手牌一起重新分組,桌面每張牌都要用到,盡量打出最多手牌 ===== */
function solveCore(hand, board, opts) {
  const budget = (opts && opts.ms) || 700;
  const t0 = Date.now();
  const mk = () => Array.from({ length: 4 }, () => Array.from({ length: 14 }, () => []));
  const bId = mk(), hId = mk();
  const jb = [], jh = [];
  for (const id of board.flat()) { const t = T(id); if (t.j) jb.push(id); else bId[t.c][t.n].push(id); }
  let hr = 0;
  for (const id of hand) { const t = T(id); if (t.j) jh.push(id); else { hId[t.c][t.n].push(id); hr++; } }
  const baseHR = hr, baseHJ = jh.length;
  if (!baseHR && !baseHJ) return null;
  const boardIds = new Set(board.flat());
  const chosen = [];
  const seen = new Set();
  let best = { score: -Infinity, sets: null };
  let nodes = 0, timeUp = false;
  const avail = (c, n) => bId[c][n].length + hId[c][n].length;

  const takeCell = (c, n) => {
    if (bId[c][n].length) return { id: bId[c][n].pop(), h: false, c, n };
    hr--; return { id: hId[c][n].pop(), h: true, c, n };
  };
  const putCell = (r) => { if (r.h) { hId[r.c][r.n].push(r.id); hr++; } else bId[r.c][r.n].push(r.id); };
  const takeJoker = () => (jb.length ? { id: jb.pop(), h: false } : { id: jh.pop(), h: true });
  const putJoker = (r) => (r.h ? jh.push(r.id) : jb.push(r.id));

  function candidates(c, n) {
    const out = [];
    const jAvail = jb.length + jh.length;
    // 順子
    for (let st = Math.max(1, n - 12); st <= n; st++) {
      for (let en = Math.max(n, st + 2); en <= Math.min(13, st + 12); en++) {
        let miss = 0, hu = 0;
        for (let k = st; k <= en; k++) {
          if (avail(c, k) < 1) { miss++; if (miss > 2 || miss > jAvail) break; } else if (!bId[c][k].length) hu++;
        }
        if (miss > 2 || miss > jAvail) continue;
        out.push({ kind: 'run', st, en, miss, hu });
      }
    }
    // 組合
    for (let mask = 0; mask < 16; mask++) {
      if (!((mask >> c) & 1)) continue;
      const cols = [0, 1, 2, 3].filter((x) => (mask >> x) & 1);
      if (cols.length < 3) continue;
      let miss = 0, hu = 0;
      for (const x of cols) { if (avail(x, n) < 1) miss++; else if (!bId[x][n].length) hu++; }
      if (miss > 2 || miss > jAvail) continue;

    const plan = bestPlan(S.hand, pub.board, S.melded, ini, 'hard');
    if (plan) {
      const r = checkMove(pub.board, plan.board, S.hand, S.melded, ini);
      if (r.ok) {
        const oldKeys = new Set(pub.board.map(setKey)), newKeys = new Set(plan.board.map(setKey));
        const made = plan.board.filter((x) => !oldKeys.has(setKey(x)));
        const broken = pub.board.filter((x) => !newKeys.has(setKey(x)));
        return { ok: true, plan, placed: plan.placed.slice(), made: made.map(setText), broken: broken.map(setText), madeIds: made.map((x) => layoutSet(x).ids), brokenIds: broken.map((x) => layoutSet(x).ids), pts: S.melded ? 0 : newSetPoints(pub.board, plan.board), left: S.hand.length - plan.placed.length };
      }
    }
    let miss = null;
    if (!S.melded) { const m = findBestMelds(S.hand, true, true); miss = Math.max(0, ini - m.points); }
    return { ok: false, miss };
  }
  function doAssist() {
    if (S.pub && S.pub.settings.assist === false) return;
    if (!isMyTurn() || !S.work) return;
    const sug = planSuggestion();
    S.assist = { sug };
    S.hint = sug.ok ? new Set(sug.placed) : null;
    render();
  }
  function applyAssist() {
    const a = S.assist;
    if (!a || !a.sug.ok || !isMyTurn()) return;
    S.pendSnap = snapWork();
    S.work = { board: a.sug.plan.board.map((x) => x.slice()), placed: new Set(a.sug.placed) };
    S.sel = null; S.msel = []; S.groups = []; S.drawArmed = false;
    changed();
  }
  function assistHTML() {
    const a = S.assist;
    if (!a || !isMyTurn()) return '';
    const g = a.sug;
    if (g.ok) return `<div class="assist"><div class="ah"><b>智能建議:可以出 ${g.placed.length} 張牌${S.melded ? '' : `(${g.pts} 點)`}</b><span class="muted">出完剩 ${g.left} 張</span></div>
      ${g.madeIds.map((st) => `<div class="arow"><span class="lab">新組</span>${miniSet(st, new Set(g.placed))}</div>`).join('')}${g.brokenIds.map((st) => `<div class="arow brk"><span class="lab">拆開</span>${miniSet(st)}</div>`).join('')}
      <div class="ar2"><button class="btn small primary" data-a="assistApply">照建議擺牌</button><button class="btn small" data-a="assistClose">關閉</button></div></div>`;
    return `<div class="assist"><div class="ah"><b>智能建議:這回合沒有合適的牌可以出</b></div><p>${g.miss != null && g.miss > 0 ? `首次出牌要湊滿 ${S.pub.settings.initial} 點,你的手牌目前最多還差 ${g.miss} 點。` : '用手牌和桌面的牌都組不出新的合法牌組。'}建議按「抽牌」。</p><div class="ar2"><button class="btn small" data-a="assistClose">關閉</button></div></div>`;
  }
  function resetWork() {
    if (!isMyTurn()) return;
    S.undo = []; S.pendSnap = null;
    S.work = { board: S.pub.board.map((s) => s.slice()), placed: new Set() };
    S.sel = null; S.drawArmed = false;
    changed();
  }
  function turnCheck() {
    if (!isMyTurn() || !S.work) return null;
    const w = S.work;
    const dirty = w.placed.size > 0 || JSON.stringify(w.board) !== JSON.stringify(S.pub.board);
    const r = checkMove(S.pub.board, w.board, S.hand, S.melded, S.pub.settings.initial);
    return { dirty, r, pts: S.melded ? 0 : newSetPoints(S.pub.board, w.board) };
  }
  function endTurn() {
    const c = turnCheck();
    if (!c || !c.r.ok) return say(c ? c.r.err : '還沒輪到你');
    const board = S.work.board.map((s) => s.slice());
    if (S.isHost) hostMove(S.G.players.findIndex((p) => p.id === S.myId), board);
    else { netEmit('act', { type: 'move', board }); say('已送出…'); }
  }
  function drawAction() {
    if (!isMyTurn()) return;
    const c = turnCheck();
    if (c && c.dirty && !S.drawArmed) {
      S.drawArmed = true; render(); say('再按一次,放棄目前的擺放並抽牌');
      clearTimeout(S.armTimer); S.armTimer = setTimeout(() => { S.drawArmed = false; render(); }, 3500);
      return;
    }
    S.drawArmed = false;
    if (S.isHost) hostDraw(S.G.players.findIndex((p) => p.id === S.myId));
    else netEmit('act', { type: 'draw' });
  }

  function statusLine() {
    const pub = S.pub;
    const cur = pub.players[pub.turn];
    if (pub.phase === 'end') return { cls: 'mute', t: '牌局已結束' };
    if (S.hostGone) return { cls: 'bad', t: '房主似乎離線了,牌局暫停' };
    if (!isMyTurn()) {
      if (cur.bot) return { cls: 'mute', t: `${cur.name}(電腦)思考中…` };
      if (cur.auto) return { cls: 'mute', t: `${cur.name} 電腦代打中…` };
      const drafting = S.draft && S.draft.n === pub.turnNo;
      return { cls: 'mute', t: `輪到 ${cur.name}${!cur.connected ? '(離線)' : drafting ? ',正在擺牌…' : ''}` };
    }
    if (cur.auto) return { cls: 'mute', t: '電腦代打中…想自己出牌請按「電腦代打:開」取消。' };
    const c = turnCheck();
    if (!c || !c.dirty) return { cls: '', t: S.melded ? '把手牌拖到桌面,或按「抽牌」。' : '首次出牌只能用自己的手牌,不能動桌面上的牌。' };

  function gameHTML() {
    const pub = S.pub;
    const my = isMyTurn() && !S.replay;
    const w = S.work;
    const board = viewBoard();
    const oldIds = new Set(pub.board.flat());
    const recent = new Set(pub.lastPlaced || []);
    const pubKeys = new Set(pub.board.map(setKey));
    const prevKeys = S.prevBoard ? new Set(S.prevBoard.map(setKey)) : null;
    const movedIds = S.prevBoard ? movedTiles(S.prevBoard, pub.board) : new Set();
    const sel = S.sel, dg = dragId();
    const setsHTML = board.map((s, si) => {
      const L = layoutSet(s);
      const locked = my && !S.melded && w && s.some((x) => !w.placed.has(x));
      const chg = !!prevKeys && pubKeys.has(setKey(s)) && !prevKeys.has(setKey(s));
      const cls = (chg ? 'chg ' : '') + (L.valid ? 'ok' : 'bad') + (L.valid && L.kind === 'group' ? ' grp' : '') + (my && w && s.some((x) => w.placed.has(x)) ? ' mine' : '') + (locked ? ' locked' : '');

        sel: sel === id || S.msel.includes(id), drag: dg === id, jv: L.jv[id],

      })).join('')}</div>`;
    }).join('');
    const rackIds = S.rackOrder.filter((id) => !(w && w.placed.has(id)));
    const st = statusLine();
    const c = turnCheck();
    const deal = S.deal && rackIds.length > 0;
    if (S.deal) S.deal = false;
    const gapKey = (id) => { const t = T(id); return S.sortMode === 'color' ? (t.j ? 9 : t.c) : S.sortMode === 'num' ? (t.j ? 99 : t.n) : null; };

    }
    const grpPts = S.groups.reduce((a, g) => a + (analyzeSet(g) ? analyzeSet(g).score : 0), 0);
    selPts += grpPts;
    const pts = placedPts + selPts;

      const me = p.id === S.myId;

    }).join('');
    const lastEv = [...S.feed].reverse().find((f) => !f.chat);
    const feed = S.feed.map((f) => f.chat ? `<div class="chat"><b>${esc(f.name)}</b> ${esc(f.m)}</div>` : `<div class="${/抽了一張牌|抽一張牌|無牌可抽/.test(f.m) ? 'dim' : /打出/.test(f.m) ? 'play' : ''}">${esc(f.m)}${miniAdded(f)}</div>`).join('');
    const canDraw = my && pub.phase === 'play';
    const dirty = !!(my && c && c.dirty);
    const dockHTML = my && pub.phase === 'play' ? `<div class="dock">${S.groups.length ? `<button class="btn big newset-btn" data-a="putgroups">出牌 ${S.groups.length + (S.msel.length && analyzeSet(S.msel) ? 1 : 0)} 組</button>` : S.msel.length > 1 ? `<button class="btn big newset-btn" data-a="putmulti">新牌組(${S.msel.length})</button>` : ''}${dirty
      ? `<div class="dpair"><button class="btn reset" data-a="undo"${S.undo && S.undo.length ? '' : ' disabled'}>復原</button><button class="btn reset" data-a="reset">重設</button></div><button class="btn big finish" data-a="end"${c.r.ok ? '' : ' disabled'}>完成回合</button>`
      : `<button class="btn big draw${S.drawArmed ? ' armed' : ''}" data-a="draw">${S.drawArmed ? '確定抽牌?' : '抽牌'}</button>`}</div>` : '';
    const sizerHTML = `<span class="szl">牌大小</span><button class="btn small" data-a="twMinus" aria-label="縮小牌">－</button><button class="btn small" data-a="twPlus" aria-label="放大牌">＋</button>`;
    const rs = S.replay && S.replay.idx > 0 ? S.replay.steps[S.replay.idx - 1] : null;
    const replayCap = rs ? `<div class="replaycap"><span class="rn">${esc(rs.name)}</span>${rs.added && rs.added.length ? `<span>打出 ${rs.added.length} 張牌</span><span class="msets">${rs.added.slice(0, 14).map((id) => miniTile(id)).join('')}</span>` : rs.changed ? '<span>重新整理了桌面</span>' : '<span>抽了一張牌</span><i class="mt back"></i>'}</div>` : '';
    const meP = pub.players.find((p) => p.id === S.myId);

    return `<div class="game${S.replay ? ' replaying' : ''}">${flash ? `<div class="turnbanner" style="animation-delay:-${flEl}ms">輪到你了</div>` : ''}
      <div class="top"><span class="title">魔橋</span>

        <div class="players">${chips}</div>
        <div class="strip"><span class="latest">${S.replay ? `回放 ${Math.max(1, S.replay.idx)}/${S.replay.steps.length}` : '最新'}:<b>${esc(S.replay ? S.replay.steps[Math.max(0, S.replay.idx - 1)].msg : lastEv ? lastEv.m : '牌局開始')}</b>${!S.replay && lastEv && lastEv.a ? `<span class="msets">${lastEv.a.slice(0, 12).map((id) => miniTile(id)).join('')}</span>` : ''}</span><span class="sp"></span>${S.replay ? '<button class="btn small replaybtn" data-a="replayStop">停止</button>' : canReplay ? '<button class="btn small replaybtn" data-a="replay">▶ 重播上一輪</button>' : ''}${timer}<span>牌堆 <b class="num">${pub.pool}</b></span></div>
        <span class="sizer topx" title="牌的大小">${sizerHTML}</span>${`<span class="topx">${sndBtn}</span>`}

        <button class="btn small menubtn" data-a="panel"><span class="lbl">紀錄</span><span class="ham">☰</span>${S.unread ? '<i class="dot"></i>' : ''}</button>
        <button class="btn small topx" data-a="rules">規則</button>
        <button class="btn small danger topx" data-a="leave">離開</button></div>
      <div class="tablearea">${replayCap}<div class="board" id="board">${setsHTML}${my ? '<div class="newset">拖到空白處 = 新牌組</div>' : ''}${board.length === 0 && !my ? '<div class="empty">桌面還沒有牌。</div>' : ''}</div></div>
      <div class="deck${my ? ' mine' : ''}${flash ? ' flash' : ''}"${flash ? ` style="animation-delay:-${flEl}ms"` : ''}>
        ${S.hostGone ? '<div class="banner">房主已離線。等待房主重新連線,或離開房間。</div>' : ''}
        <div class="status">${my ? '<span class="yourturn">輪到你</span>' : ''}<div class="msg ${st.cls}">${esc(st.t)}</div>${meter}
          <div class="actions"><div class="al"><button class="btn small" data-a="sort-color">按顏色</button><button class="btn small" data-a="sort-num">按數字</button>${pub.phase === 'play' && meP ? `<button class="btn small autobtn${meP.auto ? ' on' : ''}" data-a="auto">電腦代打:${meP.auto ? '開' : '關'}</button>` : ''}${my && pub.settings.assist !== false ? '<button class="btn small assistbtn" data-a="assist">智能建議</button>' : ''}</div></div></div>
        ${assistHTML()}
        <div class="rackwrap">
        <div class="rack${deal ? ' deal' : ''}" id="rack">${rackIds.length ? rackIds.map((id, i) => tileHTML(id, { sel: sel === id || S.msel.includes(id) || S.groups.some((g) => g.includes(id)), g: S.groups.findIndex((g) => g.includes(id)) + 1, fresh: S.fresh.has(id), hint: !!(S.hint && S.hint.has(id)), drag: dg === id, i: deal ? i : null, gap: !!S.sortMode && i > 0 && gapKey(id) !== gapKey(rackIds[i - 1]) })).join('') : '<span class="none">手牌已全部擺到桌面</span>'}</div></div>
        ${dockHTML}
      </div>
      ${S.panel ? '<div class="scrim" data-a="panel"></div>' : ''}<aside class="side${S.panel ? ' open' : ''}"><h3>紀錄與聊天 <button class="btn small" data-a="panel">關閉</button></h3>
        <div class="sidebtns"><span class="sizer">${sizerHTML}</span>${sndBtn}<button class="btn small" data-a="rules">規則</button><button class="btn small danger" data-a="leave">離開房間</button></div>
        ${levelCtlHTML(pub)}
        ${scoreTableHTML(pub)}
        <div class="feed" id="feed">${feed || '<div>還沒有紀錄</div>'}</div>
        ${S.room ? `<div class="chatrow"><input id="chatIn" class="field" maxlength="120" placeholder="說點什麼…" autocomplete="off"><button class="btn small" data-a="chat">送出</button></div>` : ''}
      </aside>

  function levelCtlHTML(pub) {
    const eff = (p) => p.level || pub.settings.level || 'hard';
    const seg = (act, id, cur) => `<span class="seg">${Object.entries(LV).map(([v, l]) => `<button data-a="${act}" data-id="${id}" data-n="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</span>`;
    const bots = pub.players.filter((p) => p.bot);

      rows.push(`<div class="lvrow"><b>全部電腦</b>${seg('setAllBots', '', null)}</div>`);

  function scoreTableHTML(pub) {
    const rs = pub.rounds || [];

  }
  function resultHTML() {
    const pub = S.pub;
    const res = pub.results || [];
    const w = pub.winner != null ? pub.players[pub.winner] : null;
    return `<div class="overlay"><div class="card">
      <h2>${w ? esc(w.name) + ' 獲勝' : '牌局結束'}</h2>
      <p>${pub.endReason === 'out' ? '最先把手牌全部打完。' : '牌堆已空,沒有人能繼續出牌,以剩餘點數最少者獲勝。'}</p>
      <div class="res">${res.map((r, i) => `<div class="r${i === pub.winner ? ' win' : ''}"><div class="h"><b>${esc(r.name)}</b><span class="hint">剩 ${r.hand.length} 張 / ${r.value} 點</span><span class="d ${r.delta >= 0 ? 'pos' : 'neg'}">${r.delta > 0 ? '+' : ''}${r.delta}</span><span class="hint">總分 ${r.total}</span></div>
        ${r.hand.length ? `<div class="mini">${r.hand.map((id) => tileHTML(id)).join('')}</div>` : ''}</div>`).join('')}</div>
      ${scoreTableHTML(pub)}
      <div class="row">${S.isHost ? '<button class="btn primary" data-a="again">再來一局</button>' : '<span class="hint">等待房主開始下一局…</span>'}
        <button class="btn ghost" data-a="hideResult">查看牌桌</button><span class="grow"></span><button class="btn danger" data-a="leave">離開</button></div>
    </div></div>`;

  function rulesHTML() {
    return `<div class="overlay" data-a="closeRules"><div class="card" data-keep="1">
      <h2>魔橋規則</h2>
      <div><h3>目標</h3><p>最先把手上所有牌打到桌面的人獲勝。</p></div>
      <div><h3>牌組</h3><ul><li><b>順子</b>:同顏色、數字連續的 3 張以上,例如 紅 4-5-6。13 後面不能接 1。</li><li><b>組合</b>:數字相同、顏色各不相同的 3 或 4 張,例如 紅7、藍7、黑7。</li></ul></div>
      <div><h3>回合</h3><ul><li>開局每人 14 張。第一次出牌,打出的新牌組點數合計要有 30 點以上,而且只能用自己的牌,不能動桌面上的牌。</li><li>開局之後,可以接牌、拆開、重組桌面上所有牌組,只要回合結束時每一組都合規則。桌面上的牌不能收回手牌。</li><li>打不出牌時抽 1 張,回合結束。</li></ul></div>
      <div><h3>百搭牌</h3><p>可以代替任何顏色和數字。桌面上的百搭牌可以用手上正確的牌換出來,換出的百搭牌要在同一回合內用到別的牌組。</p></div>
      <div><h3>計分</h3><p>勝者得到其他人手牌點數的總和,其他人各扣自己的剩餘點數,百搭牌剩在手上算 30 點。牌堆抽完且沒有人能出牌時,剩餘點數最少者獲勝。</p></div>
      <div><h3>操作</h3><ul><li>拖曳:把牌拖到桌面某一組上就加入那一組,拖到空白處就新開一組,拖回手牌區可收回本回合打出的牌。</li><li>點選:先點一張牌,再點目標牌組(或牌組裡的任一張牌、桌面空白處、手牌區)。</li><li>多選:直接在手牌連續點選多張牌(例如同色 1、2、3 或不同色 6、6、6),必須依序點選(同色連號,或同數字不同色),點錯順序就會改選那一張;選好後按「放成新牌組」,或點目標牌組、桌面空白處一次放下,也可以直接拖曳。</li><li>桌面多選:先點桌面上的一張牌,再點另一張牌;如果兩張在同一組內且能成組(同色連號,或同數字不同色),就會自動變成多選,可以繼續點同一組內的牌(例如從順子中取出連續幾張),按「新牌組」組成新牌組,或點某個牌組放進去。如果兩張不成組,就是把前一張牌移到後一張所在的牌組。桌面多選只限同一組內:選了牌之後,點另一組的任何一張牌,就把選中的牌放入該組(不論能否連起來)。首次出牌前不能動用桌面上原有的牌。</li><li>手牌上帶黃框和「新」字的是剛抽到的牌;對手上一手的改動會在桌面標出:綠色框是有變動的牌組,浮起並帶綠光的是新打出的牌,綠色虛線是被移到別組的舊牌。</li><li>智能建議(開局前可選擇關閉):輪到你時按「智能建議」,程式會算出這回合能不能出牌、怎樣出,手牌上用綠色虛線框標出要用的牌,再按「照建議擺牌」就會自動擺好(你仍然可以修改,滿意了才按完成回合)。</li><li>牌下方的黃色底線是本回合你打出的牌,紅色虛線框表示該組還不合規則。</li></ul></div>
      <div class="row"><span class="grow"></span><button class="btn primary" data-a="closeRules">知道了</button></div></div></div>`;
  }

  /* ---------- 密碼門(只有網頁版):輸入正確密碼才能使用 ---------- */
  const PW_HASH = 'badda51ba6ee7742bb1d8f8c8310d4a0b1b4d734028031859d0844328d7cf48d';
  async function sha256Hex(t) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
    return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
  }
  function pwModalHTML() {
    return `<div class="overlay" data-a="closePw"><div class="gcard" data-keep="1"><div class="gt">魔橋</div><p>開新遊戲或房間需要密碼</p>
      <input id="inPw" class="field" type="password" inputmode="numeric" autocomplete="off" placeholder="密碼" maxlength="20">
      <div class="gerr">${esc(S.pwErr)}</div>
      <div class="row"><button class="btn" data-a="closePw">取消</button><span class="grow"></span><button class="btn primary" data-a="unlock">確定</button></div></div></div>`;
  }
  function guardNew(fn) {
    if (S.unlocked) { fn(); return; }
    S.pendingAct = fn; S.pwErr = ''; S.modal = 'pw'; render();
    const e = $('#inPw'); if (e) e.focus();
  }
  async function tryUnlock() {
    const el = $('#inPw');
    const v = el ? el.value.trim() : '';
    try {
      if (!window.crypto || !crypto.subtle) { S.pwErr = '這個瀏覽器無法驗證密碼,請改用 https 連線'; render(); return; }
      if ((await sha256Hex('mk-gate:' + v)) === PW_HASH) {
        S.unlocked = true; S.pwErr = ''; S.modal = null; LS.set('mkt-unlock', PW_HASH);
        const f = S.pendingAct; S.pendingAct = null; render();
        if (f) f();
        return;
      }
    } catch (e) {}
    S.pwErr = '密碼不正確'; render();
    const e2 = $('#inPw'); if (e2) e2.focus();
  }
  function render() {
    const app = $('#app');
    if (!app) return;
    const keep = { board: ($('#board') || {}).scrollTop || 0, rack: ($('#rack') || {}).scrollTop || 0, lobby: ($('.lobby') || {}).scrollTop || 0 };
    const vals = {};
    for (const id of ['inName', 'inCode', 'chatIn', 'inPw']) { const e = document.getElementById(id); if (e) vals[id] = e.value; }
    const ae = document.activeElement;
    const aid = ae && ae.id && vals[ae.id] !== undefined ? ae.id : null;
    const pos = aid ? ae.selectionStart : 0;
    const mRules = S.modal === 'rules' ? rulesHTML() : '';
    const mPw = S.modal === 'pw' ? pwModalHTML() : '';
    app.innerHTML = !S.pub ? lobbyHTML() + mRules + mPw : S.pub.phase === 'wait' ? waitHTML() + mRules : gameHTML();
    for (const id in vals) { const e = document.getElementById(id); if (e) e.value = vals[id]; }
    if (aid) { const e = document.getElementById(aid); if (e) { e.focus(); try { e.setSelectionRange(pos, pos); } catch (er) {} } }
    const b = $('#board'), r = $('#rack'), l = $('.lobby'), f = $('#feed');
    if (b) b.scrollTop = keep.board;
    if (r) r.scrollTop = keep.rack;
    if (l) l.scrollTop = keep.lobby;
    if (f) f.scrollTop = f.scrollHeight;
    updateClock();
  }
  function updateClock() {
    const el = $('#clock');
    if (!el || !S.pub) return;
    const left = Math.max(0, S.pub.settings.timer - (Date.now() - S.turnStart) / 1000);
    const m = Math.floor(left / 60), s = Math.floor(left % 60);
    el.textContent = `${m}:${String(s).padStart(2, '0')}`;
    el.style.color = left < 10 && isMyTurn() ? 'var(--bad)' : '';
  }

  /* ---------- 事件 ---------- */
  const app = $('#app');
  app.addEventListener('input', (e) => {
    if (e.target.id === 'inName') { S.name = e.target.value.slice(0, 10); LS.set('mkt-name', S.name); }
  });
  app.addEventListener('change', (e) => {
    if (e.target.id === 'selTimer' && S.isHost && S.G && S.G.phase === 'wait') { S.G.settings.timer = +e.target.value || 0; hostBroadcast(); }
  });
  app.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (e.target.id === 'chatIn') sendChat();
      else if (e.target.id === 'inCode') joinRoom(e.target.value);
      else if (e.target.id === 'inPw') tryUnlock();
    }
  });
  function sendChat() {
    const el = $('#chatIn');
    if (!el) return;
    const text = el.value.trim().slice(0, 120);
    if (!text) return;
    el.value = '';
    S.feed.push({ chat: true, name: S.name || '玩家', m: text });
    netEmit('chat', { name: S.name || '玩家', text });
    render();
  }
  app.addEventListener('click', (e) => {
    const a = e.target.closest('[data-a]');
    if (S.moreOpen && !['more', 'twMinus', 'twPlus', 'snd'].includes(a ? a.dataset.a : '') ) { S.moreOpen = false; if (!a) { if (e.target.closest('.moremenu')) { S.moreOpen = true; return; } render(); return; } }
    if (a) {
      if ((a.dataset.a === 'closeRules' || a.dataset.a === 'closePw') && e.target.closest('[data-keep]') && !e.target.closest('button')) return;
      doAction(a.dataset.a, a);
      return;
    }
    if (e.target.closest('.tile') || !S.pub || S.pub.phase !== 'play') return;
    if (S.msel.length) {
      const sEl = e.target.closest('.set');
      if (sEl) moveMulti({ kind: 'set', si: +sEl.dataset.si });
      else if (e.target.closest('.board')) moveMulti({ kind: 'board' });
      return;
    }
    if (S.sel == null) return;
    const rackEl = e.target.closest('.rack');
    const setEl = e.target.closest('.set');
    const boardEl = e.target.closest('.board');
    if (rackEl) moveTile(S.sel, { kind: 'rack', before: null });
    else if (setEl) moveTile(S.sel, { kind: 'set', si: +setEl.dataset.si });
    else if (boardEl) moveTile(S.sel, { kind: 'board' });
  });
  function setK(v) { S.k = v; LS.set('mkt-k', String(v)); document.documentElement.style.setProperty('--k', String(v)); render(); }
  document.documentElement.style.setProperty('--k', String(S.k));
  function doAction(k, el) {
    switch (k) {
      case 'soloLevel': S.soloLevel = ['easy', 'normal'].includes(el.dataset.n) ? el.dataset.n : 'hard'; render(); break;
      case 'setLevel': if (S.isHost && S.G && S.G.phase === 'wait') { S.G.settings.level = ['easy', 'normal'].includes(el.dataset.n) ? el.dataset.n : 'hard'; S.G.players.forEach((p) => { p.level = null; }); hostBroadcast(); } break;
      case 'soloAssist': S.soloAssist = el.dataset.n === '1'; render(); break;
      case 'setAssist': if (S.isHost && S.G && S.G.phase === 'wait') { S.G.settings.assist = el.dataset.n === '1'; hostBroadcast(); } break;
      case 'soloTimer': S.soloTimer = +el.dataset.n; render(); break;
      case 'bots': S.soloBots = +el.dataset.n; render(); break;
      case 'solo': guardNew(startSolo); break;
      case 'create': guardNew(createRoom); break;
      case 'closePw': S.modal = null; S.pendingAct = null; render(); break;
      case 'join': joinRoom(($('#inCode') || {}).value); break;
      case 'resume': resumeHost(); break;
      case 'rules': S.modal = 'rules'; render(); break;
      case 'closeRules': S.modal = null; render(); break;
      case 'replay': startReplay(); break;
      case 'replayStop': stopReplay(); break;
      case 'copyLink': try { navigator.clipboard.writeText(inviteURL()).then(() => say('已複製邀請連結')).catch(() => say('請手動複製:' + inviteURL())); } catch (e) { say('請手動複製:' + inviteURL()); } break;
      case 'shareLink': try { navigator.share({ title: '魔橋', text: '來玩魔橋!房間代碼 ' + S.code, url: inviteURL() }).catch(() => {}); } catch (e) {} break;
      case 'unlock': tryUnlock(); break;
      case 'joinInvite': joinRoom(S.invite); break;
      case 'copy': try { navigator.clipboard.writeText(S.code).then(() => say('已複製房間代碼')).catch(() => say('請手動記下代碼:' + S.code)); } catch (e) { say('請手動記下代碼:' + S.code); } break;
      case 'addbot': if (S.isHost) { addBot(); hostBroadcast(); } break;
      case 'rmbot': if (S.isHost && S.G.phase === 'wait') { const i = S.G.players.map((p) => p.bot).lastIndexOf(true); if (i >= 0) { S.G.players.splice(i, 1); hostBroadcast(); } } break;
      case 'start': if (S.isHost) startGame(); break;
      case 'again': if (S.isHost && S.G && S.G.phase === 'end') { const old = S.G; S.G = { ...old, phase: 'wait' }; startGame(); } break;
      case 'hideResult': S.hideResult = true; render(); break;
      case 'leave': leave(); break;
      case 'twMinus': case 'twPlus': { const nk = Math.max(0.7, Math.min(1.5, Math.round((S.k + (k === 'twPlus' ? 0.1 : -0.1)) * 10) / 10)); setK(nk); break; }
      case 'panel': S.panel = !S.panel; if (S.panel) S.unread = 0; render(); break;
      case 'chat': sendChat(); break;
      case 'sort-color': sortRack('color'); break;
      case 'sort-num': sortRack('num'); break;
      case 'snd': S.sound = !S.sound; LS.set('mkt-snd', S.sound ? '1' : '0'); if (S.sound) { audioUnlock(); beep(); } render(); break;
      case 'undo': undoStep(); break;
      case 'reset': resetWork(); break;
      case 'more': S.moreOpen = !S.moreOpen; render(); break;
      case 'putmulti': moveMulti({ kind: 'board' }); break;
      case 'putgroups': putGroups(); break;
      case 'draw': drawAction(); break;
      case 'setBotLevel': if (S.isHost && S.G) { const i = S.G.players.findIndex((p) => p.id === el.dataset.id && p.bot); if (i >= 0) setLevel(i, el.dataset.n); } break;
      case 'setAllBots': if (S.isHost && S.G && LV[el.dataset.n]) { S.G.players.forEach((p) => { if (p.bot) p.level = el.dataset.n; }); S.G.settings.level = el.dataset.n; hostBroadcast(); } break;
      case 'setMyLevel': { if (!S.pub || !LV[el.dataset.n]) break; if (S.isHost) setLevel(S.G.players.findIndex((p) => p.id === S.myId), el.dataset.n); else netEmit('act', { type: 'level', level: el.dataset.n }); break; }
      case 'auto': { const me = S.pub && S.pub.players.find((p) => p.id === S.myId); if (!me || S.pub.phase !== 'play') break; const on = !me.auto; if (S.isHost) setAuto(S.G.players.findIndex((p) => p.id === S.myId), on); else netEmit('act', { type: 'auto', on }); break; }
      case 'assist': doAssist(); break;
      case 'assistApply': applyAssist(); break;
      case 'assistClose': S.assist = null; S.hint = null; render(); break;
      case 'end': endTurn(); break;
    }
  }

  /* ---------- 拖曳 ---------- */
  let drag = null;
  const ghost = $('#ghost');
  function canGrab(id) {
    if (!S.pub || S.pub.phase !== 'play') return false;
    if (S.work && S.work.board.some((s) => s.includes(id))) return isMyTurn();
    return true;
  }
  app.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.tile');
    if (!el || (e.button !== undefined && e.button > 0) || el.closest('.res, .fan, .codetiles')) return;
    const id = +el.dataset.id;
    if (!canGrab(id)) return;
    drag = { id, x0: e.clientX, y0: e.clientY, active: false, pid: e.pointerId, w: el.offsetWidth, h: el.offsetHeight };
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.active) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
      drag.active = true;
      ghost.innerHTML = tileHTML(drag.id);
      ghost.style.display = 'block';
      for (const t of document.querySelectorAll(`.tile[data-id="${drag.id}"]`)) t.classList.add('dragging');
    }
    ghost.style.transform = `translate(${e.clientX - drag.w / 2}px, ${e.clientY - drag.h / 2}px)`;
    markHot(dropTarget(e.clientX, e.clientY, drag.id));
  });
  function markHot(t) {
    document.querySelectorAll('.hot').forEach((x) => x.classList.remove('hot'));
    if (!t) return;
    if (t.kind === 'set') { const el = document.querySelector(`.set[data-si="${t.si}"]`); if (el) el.classList.add('hot'); }
    else if (t.kind === 'board') { const el = $('#board'); if (el) el.classList.add('hot'); }
    else if (t.kind === 'rack') { const el = $('#rack'); if (el) el.classList.add('hot'); }
  }
  function dropTarget(x, y, skip) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const rackEl = el.closest('.rack');
    if (rackEl) {
      let before = null;
      for (const t of rackEl.querySelectorAll('.tile')) {
        if (+t.dataset.id === skip) continue;
        const r = t.getBoundingClientRect();
        if (y < r.top || (y <= r.bottom && x < r.left + r.width / 2)) { before = +t.dataset.id; break; }
      }
      return { kind: 'rack', before };
    }
    const setEl = el.closest('.set');
    if (setEl) return { kind: 'set', si: +setEl.dataset.si };
    if (el.closest('.board')) return { kind: 'board' };
    return null;
  }
  function endDrag(e, cancel) {
    if (!drag || (e.pointerId !== undefined && e.pointerId !== drag.pid)) return;
    const d = drag;
    drag = null;
    if (d.active) {
      ghost.style.display = 'none'; ghost.innerHTML = '';
      document.querySelectorAll('.hot').forEach((x) => x.classList.remove('hot'));
      const tgt = cancel ? null : dropTarget(e.clientX, e.clientY, d.id);
      if (tgt && S.msel.includes(d.id)) moveMulti(tgt); else if (tgt) moveTile(d.id, tgt); else render();
    } else if (!cancel) onTileTap(d.id);
  }
  window.addEventListener('pointerup', (e) => endDrag(e, false));
  window.addEventListener('pointercancel', (e) => endDrag(e, true));
  function onTileTap(id) {
    const loc = locate(id);
    if (isMyTurn()) {
      if (loc.where === 'rack') {
        const gi = S.groups.findIndex((g) => g.includes(id));
        if (gi >= 0) { S.groups.splice(gi, 1); render(); return; } // 點已選好的組 = 取消該組
        if (S.msel.length) {
          const i = S.msel.indexOf(id);
          if (i >= 0) S.msel.splice(i, 1);
          else if (canCombine(S.msel.concat(id))) S.msel.push(id);
          else if (analyzeSet(S.msel)) { S.groups.push(S.msel.slice()); S.msel.length = 0; S.sel = id; say(`已選 ${S.groups.length} 組,繼續選下一組`); }
          else { S.msel.length = 0; S.sel = id; say('剛才選的牌不是合規牌組,已取消選擇'); }
          render(); return;
        }
        if (S.sel != null && S.sel !== id && locate(S.sel).where === 'rack') {
          if (canCombine([S.sel, id])) { S.msel = [S.sel, id]; S.sel = null; }
          else { S.sel = id; say('這兩張牌不成一組,改為只選這張'); }
          render(); return;
        }
      } else {
        const boardMulti = S.msel.length && S.msel.some((x) => locate(x).where === 'board');
        const sameSet = (x) => { const l = locate(x); return l.where === 'board' && l.si === loc.si; };
        if (boardMulti) {
          const i = S.msel.indexOf(id);
          if (i >= 0) { S.msel.splice(i, 1); render(); return; }
          if (S.msel.every(sameSet) && canCombine(S.msel.concat(id))) { S.msel.push(id); render(); return; }
        } else if (!S.msel.length && S.sel != null && S.sel !== id && locate(S.sel).where === 'board' && sameSet(S.sel)) {
          if (canCombine([S.sel, id])) { S.msel = [S.sel, id]; S.sel = null; } else { S.sel = id; }
          render(); return;
        }
        if (S.msel.length) { moveMulti({ kind: 'set', si: loc.si }); return; }
      }
    }
    if (S.sel === id) { S.sel = null; render(); return; }
    if (S.sel != null && loc.where === 'board' && isMyTurn()) { moveTile(S.sel, { kind: 'set', si: loc.si }); return; }
    if (loc.where === 'board' && !isMyTurn()) return;
    S.sel = id; render();
  }

  /* ---------- 啟動 ---------- */
  setInterval(() => { updateClock(); if (S.isHost) hostTick(); }, 500);
  render();
  (async () => {
    try { S.roomNS = PLATFORM === 'web' ? (window.firebase && window.MkNet ? window.MkNet.ns : null) : (window.claude && window.claude.use ? await window.claude.use('room') : null); } catch (e) { S.roomNS = null; }
    if (S.roomNS === undefined) S.roomNS = null;
    try {
      const r = (new URLSearchParams(location.search).get('r') || '').toUpperCase();
      if (PLATFORM === 'web' && CODE_RE.test(r) && S.roomNS && !readSaved()) {
        S.invite = r;
        history.replaceState(null, '', location.pathname);
        if (S.name && S.name.trim()) { render(); joinRoom(r).then(() => { S.invite = null; }); return; }
      }
    } catch (e) {}
    render();
  })();
  
})();
</script>
